name: CI/CD Docker Build & Push

on:
  push:
    branches: [main]  # Trigger workflow only on pushes to main branch

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub using GitHub secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker image with tags
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            malikov-d/xgenius-fastapi:latest
            malikov-d/xgenius-fastapi:${{ github.sha }}
          load: true  # Make image available in runner for testing

      # 5. Run a container to verify it works
      - name: Test Docker container
        run: |
          docker run --rm -d --name test-container malikov-d/xgenius-fastapi:latest
          echo "Sleeping 5 seconds to let container start..."
          sleep 5
          docker ps | grep test-container
          docker stop test-container
          echo "Container test completed successfully!"
